<!doctype html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Учёт">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e6e9ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0f13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Учёт</title>
<style>
:root{--bg:#e6e9ee;--card:#fff;--ink:#12161c;--sub:#5a6472;--line:#d4dae2;--soft:#f0f3f6;--sig:#ffd400;--sigbg:#fff4b0;--ok:#14803c;--okbg:#dcf3e3;--okS:#16a34a;--bad:#c81e1e;--badbg:#fde4e4;--badS:#dc2626;--warn:#a85a00;--warnbg:#ffecc7;--info:#1d4ed8;--infobg:#e0e9ff;--hero:#12161c;--hero2:#222a35;--headbg:rgba(230,233,238,.95);--r:18px;--ease:cubic-bezier(.32,.72,0,1)}
@media(prefers-color-scheme:dark){:root{--bg:#0c0f13;--card:#161a20;--ink:#f2f4f7;--sub:#9aa5b4;--line:#2a313b;--soft:#1e242c;--sigbg:#3a3300;--ok:#4ade80;--okbg:#10301d;--bad:#ff7b7b;--badbg:#3a1618;--warn:#ffb74d;--warnbg:#3a2805;--info:#8ab4ff;--infobg:#14264d;--hero:#1a2029;--hero2:#262e3a;--headbg:rgba(12,15,19,.95)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Arabic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
html,body{overflow-x:hidden;max-width:100%}
.mb{overflow-x:hidden;touch-action:pan-y}
.mb *{min-width:0}
.mb .seg button,.mb .chip,.mb .btn,.mb .fb{min-width:auto}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;transition:transform .15s var(--ease),opacity .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45}
input,textarea,select{font:inherit;color:var(--ink);width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input[type=date],input[type=time]{min-height:48px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir=rtl] select{background-position:18px 55%,13px 55%}
.ic{flex:none;vertical-align:middle}
[dir=rtl] .chev{transform:scaleX(-1)}
.bidi{unicode-bidi:plaintext;text-align:start}
[hidden]{display:none!important}
.noselect{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* header */
.head{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
@supports(backdrop-filter:blur(1px)){.head{background:var(--headbg);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:32px;font-weight:850;letter-spacing:-.03em;line-height:1.15}
.iconbtn{width:46px;height:46px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
.iconbtn.d1:after,.iconbtn.d2:after{content:"";position:absolute;top:-4px;inset-inline-end:-4px;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--bg)}
.iconbtn.d1:after{background:#f59e0b}.iconbtn.d2:after{background:var(--badS)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:0 12px;margin-top:10px;color:var(--sub)}
.search input{border:0;background:none;padding:12px 0;color:var(--ink)}
#chips{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.crow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.crow::-webkit-scrollbar{display:none}
.crow.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:650;color:var(--sub);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed}

#banner{margin:0 14px}
.bn{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:11px 13px;border-radius:15px;font-size:14px;font-weight:650;margin:6px 0 2px}
.bn.amber{background:var(--warnbg);color:var(--warn)}.bn.red{background:var(--badbg);color:var(--bad)}.bn.info{background:var(--infobg);color:var(--info)}

main{padding:0 14px}
.sec{margin:20px 2px 8px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec span{background:var(--ink);color:var(--bg);border-radius:8px;padding:0 8px;font-size:13px;line-height:21px}
.sec2{margin:14px 4px 6px;font-size:14px;font-weight:700;color:var(--sub)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card.grey .th,.card.grey .ct,.card.grey .chips2>:not(.mini2){filter:grayscale(1);opacity:.55}
.row1{display:flex;gap:12px}
.th{flex:none;width:84px;height:84px;border-radius:15px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-weight:850;font-size:26px;color:var(--sub);border:1.5px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.ct{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.nm{font-weight:800;font-size:17px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar{font-size:17px;color:var(--sub);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pc{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:750;white-space:nowrap}
.pc.y{background:var(--okbg);color:var(--ok)}.pc.n{background:var(--badbg);color:var(--bad)}
.pc.st-work{background:var(--okbg);color:var(--ok)}.pc.st-off{background:var(--warnbg);color:var(--warn)}.pc.st-vac{background:var(--infobg);color:var(--info)}.pc.st-sick{background:var(--badbg);color:var(--bad)}
.pc.me{background:var(--sigbg);color:var(--ink)}.pc.gr{background:var(--soft);color:var(--sub)}.pc.warn{background:var(--warnbg);color:var(--warn)}
.pc.org{background:var(--ink);color:var(--bg)}
button.pc{border:1.5px solid currentColor}
.foot{display:flex;gap:8px;margin-top:10px}
.fb{flex:1;min-height:48px;border-radius:13px;font-weight:800;font-size:15px;background:var(--soft);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.fb.solid{background:var(--sig);color:#12161c}
.fb.wa{background:#1fa855;color:#fff}
.step{flex:none;display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:13px;background:var(--soft);font-size:24px;font-weight:700;line-height:1;border:1.5px solid var(--line)}
.step b{min-width:40px;text-align:center;font-size:20px}
.empty{text-align:center;color:var(--sub);padding:56px 24px;font-size:15px}
.empty .ic{display:block;margin:0 auto 10px;opacity:.55}

#fab{position:fixed;inset-inline-end:16px;bottom:calc(86px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:20px;background:var(--sig);color:#12161c;z-index:20;display:grid;place-items:center;border:2px solid #12161c;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1.5px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
@supports(backdrop-filter:blur(1px)){.tabs{background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--sub)}
.tabs .ti{width:58px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s var(--ease)}
.tabs button.on{color:var(--ink);font-weight:800}.tabs button.on .ti{background:var(--sig);color:#12161c}

/* sheets */
.host{position:fixed;inset:0;z-index:50}
.bd{position:absolute;inset:0;background:rgba(5,8,12,.5);opacity:0;transition:opacity .35s var(--ease)}
.sh{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 10px);background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .45s var(--ease);overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.host.open .bd{opacity:1}.host.open .sh{transform:none}
.mh{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:20px 14px 12px;background:var(--card);border-bottom:1.5px solid var(--line);touch-action:none}
.grab{position:absolute;top:7px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
.mh b{font-size:17px;font-weight:800;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{font-size:17px;min-width:84px;text-align:start;font-weight:600}
.lnk.strong{font-weight:850;text-align:end}
.mb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.sfoot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1.5px solid var(--line)}
.fld{margin-bottom:14px}
.fld>label,.lab{display:block;font-size:14px;font-weight:750;color:var(--sub);margin:0 4px 6px}
.hint{font-size:13px;color:var(--sub);margin:6px 4px 0}
.pbox{margin-bottom:16px}
.pv{width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--soft);border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--sub)}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pbtn{display:flex;gap:8px;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:50px;padding:0 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:750;font-size:15px}
.btn.pri{background:var(--sig);color:#12161c;border-color:#12161c;flex:1}
.btn.danger{color:var(--bad)}.btn.wide{width:100%;margin-top:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(108px,140px);align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:15px;margin-bottom:6px;min-height:58px}
[dir=rtl] .prow{padding:8px 14px 8px 8px}
.pl{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;line-height:1.2;min-width:0}
.pl span{min-width:0;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--soft);border-radius:12px;padding:3px;height:44px}
.yn button{border-radius:9px;font-weight:800;font-size:14px;color:var(--sub);transition:background .2s,color .2s}
.yn[data-v="1"] button[data-v="1"]{background:var(--okS);color:#fff}
.yn[data-v="0"] button[data-v="0"]{background:var(--badS);color:#fff}
.seg{display:flex;background:var(--soft);border:1.5px solid var(--line);border-radius:15px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:42px;border-radius:12px;font-size:14px;font-weight:750;color:var(--sub);padding:0 4px;transition:background .2s,color .2s}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.st button.on[data-v=work]{background:var(--okS);color:#fff}.seg.st button.on[data-v=off]{background:#d97706;color:#fff}.seg.st button.on[data-v=vac]{background:#2563eb;color:#fff}.seg.st button.on[data-v=sick]{background:var(--badS);color:#fff}
.seg.lc button.on[data-v=me]{background:var(--sig);color:#12161c}.seg.lc button.on[data-v=other]{background:#d97706;color:#fff}.seg.lc button.on[data-v=wh]{background:#64748b;color:#fff}
.ppe{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:10px;margin-bottom:8px}
.ppe .r1{display:flex;gap:8px;margin-bottom:8px}
.ppe .r2{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.ppe .x,.rrow .x{flex:none;width:46px;height:48px;border-radius:12px;background:var(--badbg);color:var(--bad);display:grid;place-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-height:44px;padding:0 6px;font-size:14px;white-space:nowrap}
.hist{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:4px 14px}
.hist div{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px}
.hist div:last-child{border:0}.hist span{color:var(--sub);flex:none;width:84px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stats.three{grid-template-columns:1fr 1fr 1fr}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:12px}
.stat b{display:block;font-size:28px;letter-spacing:-.02em}.stat span{font-size:13px;color:var(--sub)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);padding:12px 14px;border-radius:15px;margin-bottom:6px;width:100%;text-align:start}
.srow span{color:var(--sub);font-size:13px;flex:none}
.okline{background:var(--okbg);color:var(--ok);padding:11px 14px;border-radius:13px;font-size:14px;font-weight:700}
.menu{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:start;background:var(--card);border:1.5px solid var(--line);padding:14px;border-radius:15px;margin-bottom:6px;font-weight:750}
.menu small{display:block;font-weight:500;color:var(--sub);font-size:13px;margin-top:2px}
.note{font-size:13.5px;color:var(--sub);background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:12px 14px;margin-bottom:10px}
.note ol{margin:6px 0 0;padding-inline-start:20px}.note li{margin:5px 0;color:var(--ink)}
.dayc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dayc button{flex:1 0 12%;min-width:44px;min-height:46px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:14px;color:var(--sub)}
.dayc button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;align-items:end}
.tgrid label span{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:0 4px 4px}
.rrow{display:grid;grid-template-columns:110px 1fr 46px;gap:6px;margin-bottom:6px;align-items:center}

/* today */
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:16px;margin:4px 0 10px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0,rgba(255,212,0,.13),transparent 60%);pointer-events:none}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.hdate{font-size:15px;font-weight:700;color:#c3ccd8}.hdate::first-letter{text-transform:uppercase}
.hpills{display:flex;gap:6px}
.streak{display:inline-flex;align-items:center;gap:4px;padding:0 11px;height:36px;border-radius:12px;background:var(--hero2);color:var(--sig);font-weight:850}
.hbtn{width:40px;height:36px;border-radius:12px;background:var(--hero2);color:#fff;display:grid;place-items:center}
.hmain{display:flex;align-items:center;gap:16px;margin-top:14px;position:relative;z-index:1}
.ringw{position:relative;width:112px;height:112px;flex:none}
.ring{width:112px;height:112px;display:block}
.ring circle{stroke:#333c49;transition:stroke .6s var(--ease)}
.ring circle.on{stroke:var(--sig)}
.rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.rc b{font-size:38px;font-weight:800;color:#fff}.rc span{display:block;font-size:13px;color:#93a0b1;font-weight:700;margin-top:3px}
.nx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.nx span{font-size:13px;font-weight:700;color:#93a0b1}
.nx b{font-size:20px;font-weight:850;line-height:1.2;letter-spacing:-.01em}
.nx.due span{color:#ffcf5a}.nx.late span{color:#ff8a8a}
.nx.late b{color:#ffd1d1}
.nxb{margin-top:6px;align-self:flex-start;min-height:44px;padding:0 16px;border-radius:13px;background:var(--sig);color:#12161c;font-weight:850;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.nx.late .nxb{background:#ff5d5d;color:#fff}
.nx.fin b{color:var(--sig)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px;position:relative;z-index:1}
.stp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:13px;background:var(--hero2);color:#93a0b1;font-size:11.5px;font-weight:750;border:1.5px solid transparent}
.stp.done{background:var(--sig);color:#12161c}
.stp.cur{border-color:var(--sig);color:#fff}
.hoff{margin-top:14px;position:relative;z-index:1}
.hoff b{display:block;font-size:22px;font-weight:850;margin-bottom:10px}
.tc{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:14px;margin-bottom:10px;scroll-margin-top:90px}
.tc.flash{animation:flash 1s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,212,0,.9)}100%{box-shadow:0 0 0 14px rgba(255,212,0,0)}}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ch>b{flex:1;font-size:17px;font-weight:850;min-width:0}
.cic{width:36px;height:36px;border-radius:12px;background:var(--sig);color:#12161c;display:grid;place-items:center;flex:none}
.cic.wa{background:#1fa855;color:#fff}
.addb{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:800;font-size:14px;flex:none}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--sub);flex:none;background:var(--soft)}
.badge{font-style:normal;font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--warnbg);color:var(--warn)}
.nar{display:flex;align-items:center;gap:14px;width:100%;text-align:start}
.nar .nt{flex:1;display:flex;flex-direction:column;gap:2px}.nar .nt b{font-size:20px;font-weight:850}.nar .nt span{font-size:14px;color:var(--sub);font-weight:600}
.chk{flex:none;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--sub);display:grid;place-items:center;color:#fff;transition:background .25s,border-color .25s}
.chk.on{background:var(--okS);border-color:var(--okS);animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.tc.nariad{padding-top:22px;position:relative;overflow:hidden}
.tc.nariad.todo:before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:repeating-linear-gradient(-45deg,#ffd400 0 11px,#12161c 11px 22px);background-size:31px 9px;animation:tape 1.2s linear infinite}
@keyframes tape{to{background-position:31px 0}}
.tc.nariad.done{border-color:var(--okS);background:var(--okbg)}
.tc.nariad.done .nt span{color:var(--ok)}
.pbig{display:flex;align-items:center;gap:12px}
.pbig>b{font-size:46px;font-weight:800;line-height:1;min-width:52px}

.wr.ok .fct input{border-color:var(--okS);background:var(--okbg)}
.wu{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px}

.rep{margin:0;padding:12px 14px;background:var(--soft);border-radius:14px;font:inherit;font-size:14.5px;white-space:pre-wrap;line-height:1.5;max-height:340px;overflow:auto}

/* pickers / tiles */
.pk{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1.5px solid var(--line);padding:12px;border-radius:15px;margin-bottom:6px;font-weight:700}
.pk small{display:block;color:var(--sub);font-weight:550;font-size:12.5px;margin-top:2px}
.pk div{flex:1;min-width:0}
.ck{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:#12161c;transition:background .2s,border-color .2s}
.pk.on{border-color:var(--ink)}.pk.on .ck{background:var(--sig);border-color:var(--sig);animation:pop .3s var(--ease)}
.pk.dis{opacity:.55}.pk.dis .ck{background:var(--soft)}
.pk.new{border-style:dashed;color:var(--ink)}
.sticky{position:sticky;top:-14px;z-index:2;margin:-14px -14px 12px!important;border-radius:0!important;border-width:0 0 1.5px!important;padding:2px 14px!important}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tile{min-width:0;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:6px 6px 9px;border-radius:17px;background:var(--card);border:2px solid var(--line);text-align:center}
.tile .ph{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-weight:850;font-size:22px;color:var(--sub)}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile b{font-size:13px;font-weight:750;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
.tile small{font-size:11px;color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tb{position:absolute;top:10px;inset-inline-end:10px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:grid;place-items:center;font-size:11px;font-weight:850;color:#fff;background:var(--okS);border:2px solid var(--card)}
.tile.abs{border-color:transparent;background:var(--soft)}
.tile.abs .ph{filter:grayscale(1);opacity:.45}
.tile.abs .tb{background:var(--badS)}
.tile.vac .tb{background:#2563eb}.tile.sick .tb{background:var(--badS)}.tile.off .tb{background:#d97706}
.tile.here{border-color:var(--ink);background:var(--sigbg)}
.tile.here .tb{background:var(--ink);color:var(--bg)}
.tile.else .ph{opacity:.5}
.rhead{display:flex;gap:6px;margin-bottom:12px}
.rhead i{flex:1;font-style:normal;text-align:center;padding:8px 4px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-size:12px;font-weight:750;color:var(--sub)}
.rhead i b{display:block;font-size:24px;color:var(--ink)}
.closed{text-align:center;padding:10px 0}
.bigcheck{width:96px;height:96px;margin:10px auto 14px;border-radius:50%;background:var(--okS);color:#fff;display:grid;place-items:center;animation:pop .6s var(--ease)}
.closed h2{margin:0 0 4px;font-size:28px;font-weight:850;letter-spacing:-.02em}
.closed p{margin:0 0 16px;color:var(--sub)}
.impta{min-height:200px;font-size:14px}
.dictrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:6px 6px 6px 14px;margin-bottom:6px}
[dir=rtl] .dictrow{padding:6px 14px 6px 6px}
.dictrow span{flex:1;font-weight:650}
.dictrow button{width:38px;height:38px;border-radius:10px;color:var(--sub);display:grid;place-items:center}

#dlg{position:fixed;inset:0;z-index:100;background:rgba(5,8,12,.55);display:none;align-items:flex-end;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
#dlg.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.dbox{background:var(--card);border-radius:24px;padding:18px;width:100%;max-width:440px;animation:up .38s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.dbox h3{margin:0 0 6px;font-size:19px;font-weight:850}.dbox p{margin:0 0 12px;color:var(--sub);font-size:15px}
.dbox input{margin-bottom:12px}
.dbt{display:flex;flex-direction:column;gap:6px}
.dbt button{min-height:50px;padding:0 12px;border-radius:14px;background:var(--soft);font-weight:750}
.dbt .pri{background:var(--sig);color:#12161c;font-weight:850}.dbt .danger{background:var(--badbg);color:var(--bad)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#12161cf0;color:#fff;padding:10px 12px 10px 18px;border-radius:16px;font-size:14px;font-weight:650;opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:120;max-width:92%;display:flex;align-items:center;gap:12px}

#lb.open{display:flex;animation:fade .25s}#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb button{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:14px;width:46px;height:46px;border-radius:14px;background:#fff3;color:#fff;display:grid;place-items:center}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:300}

/* ===== v4 ===== */

.grow{flex:1}

.rrow{grid-template-columns:96px minmax(0,1fr) 46px}

.tbl{overflow:auto;border:1.5px solid var(--line);border-radius:16px;background:var(--card);max-height:58vh;-webkit-overflow-scrolling:touch}

.cell{display:grid;place-items:center;width:27px;height:27px;margin:auto;border-radius:8px;font-size:11.5px;font-weight:850;color:var(--sub)}
.c-work{background:var(--okS);color:#fff}.c-off{background:#f59e0b;color:#fff}.c-vac{background:#2563eb;color:#fff}.c-sick{background:var(--badS);color:#fff}

.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}

.vhead{font-size:16px;font-weight:850;margin:14px 2px 2px;display:flex;align-items:center;gap:8px}
.vhead:first-child{margin-top:0}
.prs{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:8px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);margin-bottom:6px;font-weight:700}

.tagb{font-style:normal;font-size:11px;font-weight:850;padding:2px 7px;border-radius:6px;background:var(--okbg);color:var(--ok);margin-inline-start:6px}

.tl{background:var(--soft);border-radius:14px;padding:2px 12px}

.trow{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.trow input{max-width:150px;font-size:20px;font-weight:800}
details.more{margin-bottom:10px}details.more summary{font-weight:750;color:var(--sub);padding:8px 4px;cursor:pointer}

let db;
const data={workers:[],tools:[],small:[],trash:[],days:[],types:[],plans:[]};
let meta={dirty:0,lastExport:0};
const STORES=['workers','tools','small','trash','meta','days','types','settings','plans','snaps'];
const KEYP={meta:'k',settings:'k'};
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('uchet',3);
  r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:KEYP[n]||'id'})})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
})}
const os=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const getAll=s=>reqP(os(s).getAll());
const put=(s,o)=>reqP(os(s,'readwrite').put(o));
const del=(s,id)=>reqP(os(s,'readwrite').delete(id));
const clearS=s=>reqP(os(s,'readwrite').clear());
function bulkPut(s,items){return new Promise((res,rej)=>{if(!items||!items.length)return res();const tx=db.transaction(s,'readwrite');const st=tx.objectStore(s);items.forEach(i=>st.put(i));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

  for(const k of ['workers','tools','small','trash','days','types','plans'])data[k]=await getAll(k);

function confetti(){

  const ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,Wd=innerWidth,Hd=innerHeight;c.width=Wd*dpr;c.height=Hd*dpr;ctx.scale(dpr,dpr);

  const P=Array.from({length:160},()=>({x:Wd/2+(Math.random()-.5)*60,y:Hd*.42,vx:(Math.random()-.5)*15,vy:-Math.random()*15-5,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();let last=t0;
  (function f(tm){const dt=Math.min(32,tm-last)/16;last=tm;ctx.clearRect(0,0,Wd,Hd);
    P.forEach(p=>{p.vy+=.5*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});

}

      const gm=new Map();oth.forEach(w=>{const k=keyOf(w.owner);if(!gm.has(k))gm.set(k,{n:String(w.owner||'').trim(),a:[]});gm.get(k).a.push(w)});
      const gs=[...gm.values()].sort((a,b)=>(!a.n)-(!b.n)||a.n.localeCompare(b.n,'ru'));
      gs.forEach(g=>{if(gs.length>1||g.n)h+=sec2((g.n?t('grp_of',esc(g.n)):t('grp_none'))+' · '+g.a.length);h+=g.a.map(wCard).join('')})}
    if(!h)h=data.workers.length?emptyHTML('search',t('empty_found')):emptyHTML('users',t('empty_workers'));
  }else if(tab==='tools'){
    const f=state.f.tools,ord={me:0,other:1,wh:2};
    const arr=data.tools.filter(x=>{
      if(f.l!=='all'&&x.loc!==f.l)return false;if(f.s!=='all'&&x.status!==f.s)return false;
      return !q||norm([x.name,x.inv,x.holder,x.description].join(' ')).includes(q);
    }).sort((a,b)=>ord[a.loc]-ord[b.loc]||byName(a,b));
    const gm=new Map();arr.forEach(x=>{const k=keyOf(x.name);if(!gm.has(k))gm.set(k,[]);gm.get(k).push(x)});
    const cards=[...gm.values()].map(g=>({mine:g.some(x=>x.loc==='me'),n:g.filter(x=>x.loc==='me').length,all:g.length,html:g.length>1?tGroup(g):tCard(g[0])}));
    const mine=cards.filter(c=>c.mine),oth=cards.filter(c=>!c.mine);
    if(mine.length)h+=sec(t('sec_on_me'),mine.reduce((a,c)=>a+c.n,0))+mine.map(c=>c.html).join('');
    if(oth.length)h+=sec(t('sec_not_me'),oth.reduce((a,c)=>a+c.all,0)+mine.reduce((a,c)=>a+c.all-c.n,0))+oth.map(c=>c.html).join('');
    if(!h)h=data.tools.length?emptyHTML('search',t('empty_found')):emptyHTML('tool',t('empty_tools'));
  }else{
    const arr=data.small.filter(s=>!q||norm(s.name).includes(q)).sort(byName);
    h=arr.length?sec(t('sec_small'),arr.length)+arr.map(sCard).join(''):(data.small.length?emptyHTML('search',t('empty_found')):emptyHTML('box',t('empty_small')));
  }
  Lst.innerHTML=h;
}
function bkLevel(){const n=meta.dirty||0;if(!n)return 0;const age=meta.lastExport?Date.now()-meta.lastExport:Infinity;return (age>3*DAY&&(meta.lastExport||n>=15))?2:1}
function renderBanner(){

  if(empty&&!n){b.innerHTML=`<button class="bn info" data-go="more">${ic('undo',20)}<span>${t('empty_db')}</span></button>`;return}

const BASE_AR_MAP=(()=>{const m={};BASE_AR.forEach(([r,a])=>{m[keyOf(r)]=a});return m})();
function arOf(ru){const k=keyOf(ru);if(!k)return '';return (S.ar||{})[k]||BASE_AR_MAP[k]||(typeof GAL!=='undefined'?galAr(k):'')||''}
async function setAr(ru,ar){const k=keyOf(ru);if(!k)return;const m=Object.assign({},S.ar||{});if(ar)m[k]=ar;else delete m[k];await setSetting('ar',m,true)}
function tx(ru,lang){
  lang=lang||S.lang;if(lang!=='ar'||!ru)return ru;
  const a=arOf(ru);if(a)return a;
  const s=String(ru);
  const m=s.match(/^(.*?)[,\s]*(\d+)\s*(?:-?(?:й|го|ого))?\s*разряд[а-я]*\s*$/i);
  if(m&&m[1].trim())return tx(m[1].trim(),'ar')+'، الدرجة '+m[2];
  const parts=s.split(/\s+/);
  if(parts.length>2){const two=arOf(parts.slice(0,2).join(' '));if(two)return two+' '+parts.slice(2).join(' ')}
  if(parts.length>1){const f=arOf(parts[0]);if(f)return f+' '+parts.slice(1).join(' ')}
  return ru;
}

/* ---------- where each person is during the day ---------- */
const T0=()=>S.times.start||'08:00';
const tmin=s=>{const p=String(s||'0:0').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
const mstr=m=>Math.floor(m/60)+':'+pad(m%60);
function initLoc(d,id){
  for(const s of d.sites)if(!s.auto&&(s.init||[]).includes(id))return s.id;
  if(d.late&&d.late[id]!==undefined)return '';
  const a=d.sites.find(s=>s.auto);return a?a.id:'';
}
const movesSorted=d=>(d.moves||[]).slice().sort((a,b)=>tmin(a.time)-tmin(b.time)||(a.at||0)-(b.at||0));
function locAt(d,id,tm){let loc=initLoc(d,id);for(const m of movesSorted(d)){if(tmin(m.time)>tm)break;if(m.ids.includes(id))loc=m.to}return loc}
function siteIntervals(d,s,present){
  present=present||presentIds(d);
  const st=tmin(T0());
  const bps=[...new Set([st,...(d.moves||[]).map(m=>tmin(m.time)).filter(x=>x>st)])].sort((a,b)=>a-b);
  let out=[];
  bps.forEach(b=>{const ids=present.filter(id=>locAt(d,id,b)===s.id),key=ids.slice().sort().join(',');const last=out[out.length-1];
    if(last&&last.key===key)return;if(last)last.to=b;out.push({from:b,to:null,ids,key})});
  return out.filter(x=>x.ids.length);
}
const fullDay=ivs=>ivs.length===1&&ivs[0].from===tmin(T0())&&ivs[0].to==null;
function ivBounds(iv){const lf=tmin(S.times.lunchFrom),lt=tmin(S.times.lunchTo);let a=iv.from,b=iv.to;if(a>=lf&&a<lt)a=lt;if(b!=null&&b>lf&&b<=lt)b=lf;return [a,b]}
function ivLabel(iv,lang){const f=k=>tr(lang||S.lang,k),[a,b]=ivBounds(iv);return `${f('r_from')} ${mstr(a)}`+(b!=null?` ${f('r_to')} ${mstr(b)}`:(S.times.end?` ${f('r_to')} ${hm(S.times.end)}`:''))}
function ivShort(iv){const [a,b]=ivBounds(iv);return `${mstr(a)}–${b!=null?mstr(b):hm(S.times.end)}`}
function unassigned(d,present){present=present||presentIds(d);if(!d.sites.length)return [];return present.filter(id=>initLoc(d,id)===''&&!(d.late&&d.late[id]!==undefined))}

function groupCounts(ids){
  const m=new Map();
  ids.forEach(id=>{const w=W(id);if(!w)return;const b=(w.brigade&&brName(w.brigade))?w.brigade:'';if(!m.has(b))m.set(b,{bid:b,sng:0,are:0,none:0,n:0});const g=m.get(b);g[w.origin==='sng'||w.origin==='are'?w.origin:'none']++;g.n++});
  const order=S.brigades.map(x=>x.id),ix=b=>b?order.indexOf(b):999;
  return [...m.values()].sort((a,b)=>ix(a.bid)-ix(b.bid)).map(g=>Object.assign(g,{b:brName(g.bid)}));
}
const sumO=(gc,k)=>gc.reduce((a,g)=>a+g[k],0);
const lc1=s=>s?s[0].toLowerCase()+s.slice(1):s;

function genReport(d,lang){
  lang=lang||S.reportLang;const f=k=>tr(lang,k),X=s=>tx(s,lang);
  const present=d.id===iso()?presentIds(d):(d.present||presentIds(d));
  const out=[fmt(dDate(d))];
  d.sites.forEach(s=>{
    out.push('');
    if(s.place)out.push(X(s.place));
    const ivs=siteIntervals(d,s,present),single=ivs.length===1&&!fullDay(ivs);
    let sc=X(s.section||'');
    if(single)sc=sc?sc+' ('+lc1(ivLabel(ivs[0],lang))+')':ivLabel(ivs[0],lang);
    if(sc)out.push(sc);
    const grp=ids=>{const gc=groupCounts(ids);if(!gc.length){out.push(`${f('r_sng')} - 0     ${f('r_are')} - 0`);return}gc.forEach(g=>{if(g.b)out.push(f('r_br')+' '+g.b);out.push(`${f('r_sng')} - ${g.sng}     ${f('r_are')} - ${g.are}`)})};
    if(!ivs.length)grp([]);else if(ivs.length===1)grp(ivs[0].ids);else ivs.forEach(iv=>{out.push(ivLabel(iv,lang));grp(iv.ids)});
    const ws=s.works.filter(w=>w.name);
    if(ws.length)out.push('');
    ws.forEach((w,i)=>{let line=`${i+1}. ${X(w.name.trim())}`;const q=String(w.fact||'').trim();if(w.unit&&q)line+=` - ${q} ${X(w.unit)}`;out.push(line.replace(/\.+$/,'')+'.')});
  });
  return out.join('\n');
}

function steps(d){

    {k:'people',done:!!d.roll},
    {k:'nariad',done:naryadOK(d)},
    {k:'works',done:d.sites.length>0&&d.sites.every(s=>s.works.length>0)},

function streak(){
  let n=0;const d=new Date();const td=data.days.find(x=>x.id===iso(d));

  return n;
}

function naryadICS(n){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');

  const prev=(()=>{const x=new Date(n.to+'T12:00:00');x.setDate(x.getDate()-1);return iso(x)})();
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Uchet//EN','METHOD:PUBLISH',...ev(prev,'📋 '+t('nar_end_soon',n.num||'—',t('nar_cal_tomorrow')),'a'),...ev(n.to,'📋 '+t('nar_end_soon',n.num||'—',t('nar_cal_today')),'b'),'END:VCALENDAR'].join('\r\n');
}

/* ================= import old reports ================= */
function parseReports(txt,loose){
  const types=new Map(),places=new Set(),sections=new Set(),brig=new Map();let sc='';
  txt.split(/\r?\n/).forEach(raw=>{
    const l=raw.replace(/ /g,' ').trim();if(!l)return;
    if(/^\d{1,2}[./]\d{1,2}[./]\d{2,4}$/.test(l))return;
    let m=l.match(/^Бр\.?\s*(.+)$/i);if(m){const n=m[1].trim().replace(/\s+/g,' ');brig.set(keyOf(n),n);return}
    if(/(^|[^А-Яа-яЁё])(СНГ|АРЕ)([^А-Яа-яЁё]|$)/.test(l)&&!/^\d+\s*[.)]/.test(l))return;
    if(/^с\s*\d{1,2}[:.]\d{2}/i.test(l))return;
    m=l.match(/^\d+\s*[.)]\s*(.+)$/)||(loose&&!/^\d/.test(l)&&(/\S\s*-\s*\d/.test(l)||/^[-•*–]\s+\S/.test(l))?[l,l.replace(/^[-•*–]\s*/,'')]:null);
    if(m){
      const body=m[1].trim().replace(/\s+/g,' ');
      const q=body.match(/^(.*\S)\s*-\s*(\d+(?:[.,]\d+)?)\s*([^\d\s.,][^]*)?$/);
      let name=body,qty='',unit='';
      if(q){name=q[1];qty=q[2];unit=(q[3]||'').trim().replace(/\.+$/,'')}
      name=name.replace(/\s*\.+$/,'').trim();if(!name)return;
      const k=keyOf(name);const ex=types.get(k)||{name,unit:'',qty:'',n:0,sections:new Set()};
      ex.n++;if(unit&&!ex.unit)ex.unit=unit;if(qty)ex.qty=qty;if(sc)ex.sections.add(sc);types.set(k,ex);return;
    }
    const l2=l.replace(/\(\s*с\s*\d.*?\)/i,'').trim();if(!l2)return;
    if(/\d/.test(l2))places.add(l2);else{sc=l2;sections.add(l2)}
  });
  return {types:[...types.values()],places:[...places],sections:[...sections],brig:[...brig.values()]};
}

/* ================= v5: day migration ================= */
function legacyResolve(d,present){
  const slotsOf=m=>m==='split'?['am','pm']:[m||'day'];
  const P=new Set(present),tA=new Set(),tP=new Set(),res={};
  const take=(r,sl)=>(r[sl]||[]).forEach(i=>{if(sl!=='pm')tA.add(i);if(sl!=='am')tP.add(i)});
  d.sites.forEach(s=>{if(s.auto)return;const p=s.people||{},r={};slotsOf(s.mode).forEach(sl=>{r[sl]=(p[sl]||[]).filter(i=>P.has(i));take(r,sl)});res[s.id]=r});
  const a=d.sites.find(s=>s.auto);
  if(a){const r={};slotsOf(a.mode).forEach(sl=>{r[sl]=present.filter(i=>sl==='day'?!tA.has(i)&&!tP.has(i):sl==='am'?!tA.has(i):!tP.has(i))});res[a.id]=r}
  return res;
}
function migrateDay(d){
  if(d._m5)return d;
  if(!d.sites){
    const ws=(d.works||[]).map(w=>({id:w.id||uid(),typeId:w.typeId||'',name:w.name||'',unit:w.unit||'',plan:w.plan||'',fact:w.fact||''}));
    d.sites=(d.place||ws.length)?[{id:uid(),place:d.place||'',section:'',auto:true,init:[],works:ws}]:[];
    delete d.works;delete d.place;
  }
  d.tasks=d.tasks||[];d.date=d.date||d.id;d.moves=d.moves||[];d.late=d.late||{};d.sig=d.sig||{};
  if(!d.att){d.att={};(d.present||[]).forEach(i=>d.att[i]='work')}
  if(!d.ext&&d.id===iso()&&!d.roll&&!d.v5)d.att={};
  if(d.sites.some(s=>s.mode!==undefined||s.people)){
    const present=Object.keys(d.att).filter(i=>d.att[i]==='work');
    const R=legacyResolve(d,present),amL={},pmL={};
    d.sites.forEach(s=>{const r=R[s.id]||{};(r.day||[]).forEach(i=>{amL[i]=s.id;pmL[i]=s.id});(r.am||[]).forEach(i=>amL[i]=s.id);(r.pm||[]).forEach(i=>pmL[i]=s.id)});
    d.sites.forEach(s=>{s.init=s.auto?[]:present.filter(i=>amL[i]===s.id)});
    const lt=(S.times&&S.times.lunchTo)||'14:00';
    present.forEach(i=>{if(!amL[i])d.late[i]=lt});
    const grp={};present.forEach(i=>{const a=amL[i]||'',p=pmL[i]||'';if(p!==a)(grp[p]=grp[p]||[]).push(i)});
    Object.keys(grp).forEach(to=>d.moves.push({id:uid(),time:lt,ids:grp[to],to,reason:to?'':'home',added:[],at:0}));
    d.sites.forEach(s=>{delete s.mode;delete s.people});
  }
  d.sites.forEach(s=>{if(!s.init)s.init=[]});
  d.v5=1;d._m5=1;
  return d;
}

/* ================= v5: someone else's report ================= */
function parseReportDays(txt){
  const days=[];let d=null,site=null,blk=0;
  const newDay=date=>{d={date,sites:[],head:0,lines:[]};days.push(d);site=null};
  const curSite=()=>{if(!d)newDay(iso());if(!site){site={place:'',section:'',works:[]};d.sites.push(site)}return site};
  const closeBlk=()=>{if(d&&blk>d.head)d.head=blk;blk=0};
  txt.split(/\r?\n/).forEach(raw=>{
    const l=raw.replace(/ /g,' ').trim();
    let m=l.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})$/);
    if(m){closeBlk();let y=+m[3];if(y<100)y+=2000;newDay(`${y}-${pad(+m[2])}-${pad(+m[1])}`);d.lines.push(raw);return}
    if(d)d.lines.push(raw);
    if(!l)return;
    if(/^Бр\.?/i.test(l))return;
    if(/(^|[^А-Яа-яЁё])(СНГ|АРЕ)([^А-Яа-яЁё]|$)/.test(l)&&!/^\d+\s*[.)]/.test(l)){const a=l.match(/СНГ\s*[-–:]?\s*(\d+)/),b=l.match(/АРЕ\s*[-–:]?\s*(\d+)/);blk+=(a?+a[1]:0)+(b?+b[1]:0);return}
    closeBlk();
    if(/^с\s*\d{1,2}[:.]\d{2}/i.test(l))return;
    m=l.match(/^\d+\s*[.)]\s*(.+)$/);
    if(m){const body=m[1].trim().replace(/\s+/g,' ');const q=body.match(/^(.*\S)\s*-\s*(\d+(?:[.,]\d+)?)\s*([^\d\s.,][^]*)?$/);let name=body,qty='',unit='';if(q){name=q[1];qty=q[2];unit=(q[3]||'').trim().replace(/\.+$/,'')}name=name.replace(/\s*\.+$/,'').trim();if(name)curSite().works.push({name,qty,unit});return}
    const l2=l.replace(/\(\s*с\s*\d.*?\)/i,'').trim();if(!l2)return;
    if(/\d/.test(l2)){if(site&&(site.works.length||site.place))site=null;curSite().place=l2}
    else{const p=site?site.place:'';if(site&&(site.works.length||site.section)){site=null;curSite().place=p}curSite().section=l2}
  });
  closeBlk();
  return days.filter(x=>x.sites.some(s=>s.works.length)).map(x=>{x.sites=x.sites.filter(s=>s.works.length);return x});
}

function backupPayload(){const st={};SKEYS.forEach(k=>st[k]=S[k]);return {app:'uchet',version:3,exported:new Date().toISOString(),workers:data.workers,tools:data.tools,small:data.small,trash:data.trash,days:data.days.filter(d=>d.updated||d.sites.length||d.tasks.length),types:data.types,plans:data.plans,settings:st}}
async function markExported(){meta.dirty=0;meta.lastExport=Date.now();await put('meta',{k:'dirty',v:0});await put('meta',{k:'lastExport',v:meta.lastExport});renderBanner();renderGear()}
async function shareFile(blob,name,type,title){
  const file=new File([blob],name,{type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return true}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true;
  }catch(e){if(e&&e.name==='AbortError')return false;alert(t('copy_fail')+e.message);return false}
}
async function exportBackup(){
  const ok=await shareFile(new Blob([JSON.stringify(backupPayload())],{type:'application/json'}),'uchet-backup.json','application/json',t('share_title'));
  if(!ok)return false;
  await markExported();toast(t('copy_saved'));
  const m=$('.host [data-lastbk]');if(m)m.textContent=bkStatus();
  return true;
}
const bkStatus=()=>meta.lastExport?t('last_copy',new Date(meta.lastExport).toLocaleString(loc(),{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})):t('no_copy');
async function importBackup(file){
  let j;
  try{j=JSON.parse(await file.text());if(j.app!=='uchet')throw new Error('x')}catch(e){alert(t('bad_file'));return}
  if(j.type==='people')return importPeople(j);
  const Wk=j.workers||[],T=j.tools||[],Sm=j.small||[],D=j.days||[];
  const empty=!data.workers.length&&!data.tools.length&&!data.small.length&&!data.days.some(d=>d.updated)&&!data.plans.length;
  let mode='replace';
  if(!empty){
    const a=await ask({title:t('restore_title'),text:t('in_file',Wk.length,T.length,Sm.length,D.length)+'<br>'+t('what_to_do'),buttons:[{l:t('merge'),v:'merge',c:'pri'},{l:t('replace_all'),v:'replace',c:'danger'},{l:t('cancel'),v:false}]});
    if(!a.v)return;mode=a.v;
    if(mode==='replace')await snapNow('pre').catch(()=>{});
  }
  return applyBackup(j,mode);
}
async function applyBackup(j,mode){
  const Wk=j.workers||[],T=j.tools||[],Sm=j.small||[],R=j.trash||[],D=j.days||[],Ty=j.types||[],Pl=Array.isArray(j.plans)?j.plans:null;
  try{
    if(mode==='replace'){for(const k of ['workers','tools','small','trash','days','types'])await clearS(k);if(Pl)await clearS('plans')}
    await bulkPut('workers',Wk);await bulkPut('tools',T);await bulkPut('small',Sm);await bulkPut('trash',R);await bulkPut('days',D);await bulkPut('types',Ty);if(Pl)await bulkPut('plans',Pl);
    if(j.settings){for(const k of SKEYS)if(j.settings[k]!==undefined&&(mode==='replace'||['brigades','places','sections','naryads','officials'].includes(k)&&!(S[k]||[]).length))await setSetting(k,j.settings[k],true)}
    await loadAll();
    if(mode==='replace'){meta.dirty=0;await put('meta',{k:'dirty',v:0})}else await touch();
    $$('.host').forEach(s=>s.close&&s.close());
    applyLang();render();toast(t('restored'));
  }catch(e){alert(t('restore_err')+e.message)}
}

/* ================= v8: daily auto-snapshots inside the phone ================= */
const SNAP_KEEP=7;
function snapPayload(){
  const p=clone(backupPayload());
  const strip=o=>{if(o&&o.photo&&!String(o.photo).startsWith('gallery/')){o.photo=null;o.thumb=null}};
  p.workers.forEach(strip);p.tools.forEach(strip);(p.trash||[]).forEach(x=>strip(x.item));
  return p;
}
async function snapNow(kind){
  const p=snapPayload(),id=kind==='pre'?'pre-'+Date.now():iso();
  await put('snaps',{id,at:Date.now(),kind:kind||'day',p,n:[p.workers.length,p.tools.length,p.days.length,(p.plans||[]).length]});
  const all=(await getAll('snaps')).sort((a,b)=>b.at-a.at);
  const days=all.filter(x=>!String(x.id).startsWith('pre-')),pre=all.filter(x=>String(x.id).startsWith('pre-'));
  for(const x of [...days.slice(SNAP_KEEP),...pre.slice(3)])await del('snaps',x.id);
}
async function autoSnap(){
  try{
    if(meta.lastSnap===iso())return;
    if(!data.workers.length&&!data.tools.length&&!data.small.length&&!data.days.some(d=>d.updated)&&!data.plans.length)return;
    await snapNow('day');meta.lastSnap=iso();await put('meta',{k:'lastSnap',v:meta.lastSnap});
  }catch(e){console.warn('snap',e)}
}
async function snapsSheet(){
  const draw=async()=>{const all=(await getAll('snaps')).sort((a,b)=>b.at-a.at);
    return `<div class="note">${t('snaps_intro')}</div>`+(all.map(x=>`<button class="menu" data-snap="${esc(x.id)}"><div>${esc(new Date(x.at).toLocaleString(loc(),{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))}${x.kind==='pre'?` · ${t('snap_pre')}`:''}<small>${esc(t('snap_cnt',...(x.n||[0,0,0,0])))}</small></div>${ic('undo',20)}</button>`).join('')||emptyHTML('save',t('snaps_none')))+`<button class="btn wide" style="margin-top:10px" data-snapnow>${ic('save',18)} ${t('snap_now')}</button>`};
  const w=sheet({title:t('snaps'),left:t('close'),tapOut:true,body:`<div id="snl">${await draw()}</div>`});
  $('#snl',w).onclick=async e=>{
    if(e.target.closest('[data-snapnow]')){await snapNow('day');meta.lastSnap=iso();await put('meta',{k:'lastSnap',v:meta.lastSnap});$('#snl',w).innerHTML=await draw();toast(t('snap_saved'));return}
    const b=e.target.closest('[data-snap]');if(!b)return;
    const x=(await getAll('snaps')).find(y=>String(y.id)===b.dataset.snap);if(!x)return;
    const when=new Date(x.at).toLocaleString(loc(),{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    if(!(await ask({title:t('snap_restore_q',when),text:esc(t('snap_restore_t')),buttons:[{l:t('snap_restore'),v:true,c:'danger'},{l:t('cancel'),v:false}]})).v)return;
    await snapNow('pre');
    const j=clone(x.p);
    const keepPh=(arr,cur)=>arr.forEach(o=>{if(!o.photo){const c=cur.find(y=>y.id===o.id);if(c&&c.photo){o.photo=c.photo;o.thumb=c.thumb}}});
    keepPh(j.workers||[],data.workers);keepPh(j.tools||[],data.tools);
    if(!Array.isArray(j.plans))j.plans=[];
    await applyBackup(j,'replace');toast(t('snap_done'));
  };
}

/* ================= v8: backup size & cleaning old photos ================= */
const isData=p=>typeof p==='string'&&p.startsWith('data:');
const phLen=o=>o?(isData(o.photo)?o.photo.length:0)+(isData(o.thumb)?o.thumb.length:0):0;
const MB=n=>(n/1048576).toFixed(n<1048576?2:1).replace('.',S.lang==='ar'?'.':',');
function sizeInfo(){
  const total=JSON.stringify(backupPayload()).length;
  const w=data.workers.reduce((a,o)=>a+phLen(o),0),tl=data.tools.reduce((a,o)=>a+phLen(o),0);
  const tr=JSON.stringify(data.trash).length,trph=data.trash.reduce((a,x)=>a+phLen(x.item),0);
  const pl=(data.plans||[]).reduce((a,p)=>a+(p.bg&&isData(p.bg.src)?p.bg.src.length:0),0);
  return {total,w,tl,tr,trph,pl,other:Math.max(0,total-w-tl-tr-pl)};
}
function shrinkData(src,max,q){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.max(im.naturalWidth,im.naturalHeight);if(k<=max){res(src);return}const o=drawImg(im,max,q);res(o.length<src.length?o:src)};im.onerror=()=>res(src);im.src=src})}
async function sizeSheet(){
  const draw=()=>{const z=sizeInfo(),row=(l,v,sub)=>`<div class="pv2"><b>${l}</b><span class="num">${t('sz_mb',MB(v))}</span></div>`;
    return `<div class="note">${t('sz_intro')}</div>
    <div class="card" style="padding:4px 14px;margin-bottom:14px">${row(t('sz_total'),z.total)}${row(t('sz_w'),z.w)}${row(t('sz_t'),z.tl)}${row(t('sz_tr',data.trash.length),z.tr)}${z.trph?`<div class="pv2"><b style="color:var(--sub);font-weight:600">· ${t('sz_trph')}</b><span class="num">${t('sz_mb',MB(z.trph))}</span></div>`:''}${z.pl?row(t('sz_pl'),z.pl):''}${row(t('sz_other'),z.other)}</div>
    <button class="menu" data-z="trph" ${z.trph?'':'disabled'}><div>${t('sz_trash_ph')}<small>${t('sz_trash_ph_sub')}</small></div>${ic('image',20)}</button>
    <button class="menu" data-z="trall" ${data.trash.length?'':'disabled'}><div>${t('sz_trash_all')}<small>${t('sz_trash_all_sub')}</small></div>${ic('trash',20)}</button>
    <button class="menu" data-z="shrink" ${z.w+z.tl?'':'disabled'}><div>${t('sz_shrink')}<small>${t('sz_shrink_sub')}</small></div>${ic('download',20)}</button>
    <div id="szdone"></div>`};
  const w=sheet({title:t('sz'),left:t('close'),tapOut:true,body:`<div id="szb">${draw()}</div>`});
  const done=async before=>{$('#szb',w).innerHTML=draw();const after=sizeInfo().total;
    $('#szdone',w).innerHTML=`<div class="note" style="margin-top:12px"><b>${t('sz_done',MB(before),MB(after))}</b><br>${t('sz_after')}</div><button class="btn pri wide" data-z="save">${ic('save',20)} ${t('sz_save_now')}</button>`;await touch()};
  $('#szb',w).onclick=async e=>{
    const b=e.target.closest('[data-z]');if(!b||b.disabled)return;const k=b.dataset.z,before=sizeInfo().total;
    if(k==='save')return exportBackup();
    if(k==='trph'){for(const x of data.trash){if(phLen(x.item)){x.item.photo=null;x.item.thumb=null;await put('trash',x)}}return done(before)}
    if(k==='trall'){if(!(await confirmDlg(t('sz_trash_all_q',data.trash.length),'')))return;await clearS('trash');data.trash=[];return done(before)}
    if(k==='shrink'){
      if(!(await ask({title:t('sz_shrink_q'),text:esc(t('sz_shrink_t')),buttons:[{l:t('sz_shrink_btn'),v:true,c:'pri'},{l:t('cancel'),v:false}]})).v)return;
      await snapNow('pre').catch(()=>{});toast(t('sz_working'));
      for(const kind of ['workers','tools']){for(const o of data[kind]){if(!phLen(o))continue;
        const np=isData(o.photo)?await shrinkData(o.photo,800,.72):o.photo,nt=isData(o.thumb)?await shrinkData(o.thumb,220,.7):o.thumb;
        if(np!==o.photo||nt!==o.thumb){o.photo=np;o.thumb=nt;await put(kind,o)}}}
      for(const x of data.trash){const o=x.item;if(!phLen(o))continue;if(isData(o.photo))o.photo=await shrinkData(o.photo,800,.72);if(isData(o.thumb))o.thumb=await shrinkData(o.thumb,220,.7);await put('trash',x)}
      render();return done(before)}
  };
}

/* ================= reminders (calendar file) ================= */
function buildICS(rems,wds){
  const map=['SU','MO','TU','WE','TH','FR','SA'];
  const d=new Date();for(let i=0;i<8&&!wds.includes(d.getDay());i++)d.setDate(d.getDate()+1);
  const ymd=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const e=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Uchet//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+e(t('cal_name'))];
  rems.forEach(r=>{
    const p=r.time.split(':').map(Number),hh=p[0],mm=p[1],en=new Date(2000,0,1,hh,mm+10);
    const txt='📋 '+t('rk_'+r.kind);
    out.push('BEGIN:VEVENT','UID:'+r.id+'-'+r.time.replace(':','')+'@uchet','DTSTAMP:'+stamp,'DTSTART:'+ymd+'T'+pad(hh)+pad(mm)+'00','DTEND:'+ymd+'T'+pad(en.getHours())+pad(en.getMinutes())+'00','RRULE:FREQ=WEEKLY;BYDAY='+wds.map(x=>map[x]).join(','),'SUMMARY:'+e(txt),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(txt),'TRIGGER:PT0S','END:VALARM','END:VEVENT');
  });
  out.push('END:VCALENDAR');return out.join('\r\n');
}
function remSheet(){
  const kinds=['nariad','nariad2','fact','report'];
  const row=r=>`<div class="rrow" data-rid="${r.id}"><input type="time" data-r="time" value="${esc(r.time)}"><select data-r="kind">${kinds.map(k=>`<option value="${k}" ${r.kind===k?'selected':''}>${t('rk_'+k)}</option>`).join('')}</select><button type="button" class="x" data-rm>${ic('x',18)}</button></div>`;
  const body=`<div class="note">${t('rem_intro')}</div><div id="rl">${S.reminders.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(row).join('')}</div>
  <button class="btn wide" data-add>${ic('plus',18)} ${t('rem_add')}</button>
  <button class="btn pri wide" style="margin-top:14px" data-cal>${ic('cal',20)} ${t('add_cal')}</button><div class="hint">${t('cal_hint')}</div>`;
  const read=()=>$$('.rrow',w).map(r=>({id:r.dataset.rid,time:$('[data-r=time]',r).value||'07:00',kind:$('[data-r=kind]',r).value}));
  const w=sheet({title:t('rem_title'),body,onSave:async()=>{await setSetting('reminders',read())}});
  $('[data-add]',w).onclick=()=>{$('#rl',w).insertAdjacentHTML('beforeend',row({id:'r'+uid(),time:'08:00',kind:'nariad'}))};
  $('#rl',w).onclick=e=>{const b=e.target.closest('[data-rm]');if(b)b.closest('.rrow').remove()};
  $('[data-cal]',w).onclick=async()=>{
    if(!S.workdays.length){toast(t('no_workdays'));return}
    const rems=read();await setSetting('reminders',rems,true);
    await shareFile(new Blob([buildICS(rems,S.workdays)],{type:'text/calendar'}),'uchet-reminders.ics','text/calendar',t('rem_title'));
  };
}

    if(be){const on=be.dataset.v==='1';be.parentElement.dataset.v=on?1:0;await setSetting('betaPlan',on);applyLang();return}
    const dd=e.target.closest('#wdays button');
    if(dd){const d=+dd.dataset.d,a=S.workdays.includes(d)?S.workdays.filter(x=>x!==d):[...S.workdays,d];dd.classList.toggle('on');await setSetting('workdays',a);return}
    const sg=e.target.closest('.seg button');
    if(sg){const k=sg.parentElement.dataset.seg;await setSetting(k,sg.dataset.v);
      if(k==='lang'){w.close();applyLang();render();setTimeout(moreSheet,420)}else{$$('button',sg.parentElement).forEach(x=>x.classList.toggle('on',x===sg))}}
  });
  w.addEventListener('change',async e=>{if(e.target.matches('[data-myname]'))return setSetting('myName',e.target.value.trim());const k=e.target.dataset.tm;if(!k)return;await setSetting('times',Object.assign({},S.times,{[k]:e.target.value}))});
  $('[data-restore]',w).onchange=e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value=''};
  (async()=>{
    let txt='';
    try{
      const p=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():null;
      if(p!==null)txt+=p?t('stor_on'):t('stor_off');
      if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();txt+=t('stor_used',(e.usage/1048576).toFixed(1))}
    }catch(x){}
    const el=$('[data-stor]',w);if(el)el.textContent=txt||t('stor_local');
    try{const n=(await getAll('snaps')).filter(x=>x.kind!=='pre').length;const sn=$('[data-snapn]',w);if(sn)sn.textContent=t('snaps_sub',n)}catch(x){}
  })();
}

/* ================= in-app reminders ================= */
const fired=new Set();
function tick(){
  const now=new Date(),hhmm=pad(now.getHours())+':'+pad(now.getMinutes());
  if(isWorkday(now)||getDay(iso()).workAnyway){
    S.reminders.forEach(r=>{const key=iso()+r.id+r.time;if(r.time===hhmm&&!fired.has(key)){fired.add(key);toast('🔔 '+t('rk_'+r.kind))}});
  }
  if(state.tab==='today'&&!$('.host')&&!(document.activeElement&&document.activeElement.matches('input,textarea'))){const h=$('#hero');if(h)h.innerHTML=heroHTML(getDay(iso()),isWorkday(now)||getDay(iso()).workAnyway)}
}

/* ================= boot ================= */
(async()=>{
  db=await openDB();await loadAll();await purgeTrash();if(meta.gal)GAL=meta.gal;applyLang();prevRing='00000';render();await syncToday();
  loadGallery();
  const nx=naryadsActive(iso()).filter(n=>daysBetween(iso(),n.to)<=1);if(nx.length)setTimeout(()=>toast(t('nar_end_soon',nx[0].num||'—',daysBetween(iso(),nx[0].to)<=0?t('nar_cal_today'):t('nar_cal_tomorrow'))),1200);
  if(!meta.onboarded&&!data.workers.length&&!data.types.length)setTimeout(onboarding,600);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator){
    let hadCtrl=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl){hadCtrl=true;return}updBar()});
    navigator.serviceWorker.register('sw.js').then(r=>{setInterval(()=>r.update().catch(()=>{}),30*60e3)}).catch(()=>{});
  }
  setTimeout(autoSnap,2500);
  if(S.seenVer!==APP_VER){const old=data.workers.length||data.days.length;await setSetting('seenVer',APP_VER,true);if(old&&meta.onboarded)setTimeout(whatsNew,900)}
  setInterval(tick,30000);
  let lastDay=iso();
  document.addEventListener('visibilitychange',async()=>{if(document.hidden)return;
    if(pendingSend&&Date.now()-pendingSend<20*60e3){pendingSend=0;const d=getDay(iso());if(!d.sent){const r=await ask({title:t('sent_q'),buttons:[{l:t('sent_yes'),v:true,c:'pri'},{l:t('sent_no'),v:false}]});if(r.v)return markSent(d)}}
    pendingSend=0;autoSnap();await syncToday();if(iso()!==lastDay){lastDay=iso();render();return}if(state.tab==='today'&&!$('.host')&&!(document.activeElement&&document.activeElement.matches('input,textarea')))renderList()});
})().catch(err=>{document.body.innerHTML='<p style="padding:24px">'+esc(err.message)+'</p>'});
</script>
